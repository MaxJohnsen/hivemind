name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: docker compose up -d --wait db
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: npm test
