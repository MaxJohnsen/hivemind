services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: hivemind
      POSTGRES_DB: hivemind
    ports:
      - "127.0.0.1:${HIVEMIND_DB_PORT:-5442}:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 2s
      retries: 30

  hivemind:
    build: .
    environment:
      DATABASE_URL: postgres://hivemind_app:hivemind_app@db:5432/hivemind
      DATABASE_ADMIN_URL: postgres://hivemind:hivemind@db:5432/hivemind
    ports:
      - "127.0.0.1:${HIVEMIND_PORT:-4100}:4100"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
